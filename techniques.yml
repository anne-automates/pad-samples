# The techniques the samples show. A sample lists its techniques by id (techniques: in sample.yml);
# tools/build_docs.py refuses an id that is not here and writes TECHNIQUES.md, the index by technique.
# One technique = one reusable idea a consultant can carry to another flow. Keep the list short and precise.
# label: 1 to 3 words for the gallery ; title: the heading of its section in TECHNIQUES.md ; summary: one or two sentences.

local-function:
  label: Local function
  title: Local function with a contract
  summary: A local subflow with declared inputs and outputs, called in one CALL line. Copy it into any flow, create its variables, call it.

errors-as-outputs:
  label: Errors as outputs
  title: Errors returned, never thrown
  summary: The subflow sets every output first, then reports a failure through a flag and a message. The caller decides what to do; the flow never stops inside a reusable part.

powershell-script:
  label: PowerShell action
  title: One PowerShell action for what PAD cannot do
  summary: A single Run PowerShell script action covers the missing capability; its inputs are PAD variables, its output is parsed back into variables.

excel-com:
  label: Excel COM
  title: Excel driven through COM
  summary: The script opens Excel hidden and read-only, and uses Excel's own engines (here the HTML publisher) instead of reading cell by cell.

email-safe-html:
  label: Email-safe HTML
  title: Email-safe HTML
  summary: Inline CSS on every cell (the styling email clients keep), no style block, hidden cells removed, non-ASCII characters as entities.

outlook-draft:
  label: Outlook draft
  title: Outlook draft instead of a send
  summary: The message is saved as a draft and opened on screen, so a person checks it before it leaves.

text-parsing:
  label: Text parsing
  title: Parsing file names and text
  summary: Split, replace and convert text to read structured values (references, dates) from names that follow several conventions.

desktop-ui-automation:
  label: Desktop UI automation
  title: Desktop UI automation with stable selectors
  summary: UI elements pasted with the code, selectors built on automation ids, a keyboard fallback where the screen resists.

local-llm:
  label: Local AI model
  title: A language model served on the PC
  summary: The Invoke Local LLM action calls a model that runs on the PC (Ollama), with no account and no key; the data never leaves the PC. Temperature 0 gives the same answer to the same text.

json-by-regex:
  label: JSON by regex
  title: JSON answers read field by field
  summary: Each field of a JSON answer is read with its own regular expression and checked against the allowed values, so a missing or unexpected field becomes a clear error instead of stopping the flow.

trained-classifier:
  label: Trained classifier
  title: A small classifier trained on your own sorted data
  summary: An embedding model turns each text into a vector; a logistic regression learns your categories from a few dozen sorted examples in seconds on the CPU, and gives a confidence that sends doubtful cases to a person.

test-cases-file:
  label: Test cases file
  title: Test cases replayed from a file
  summary: A subflow replays the lines of a CSV file through the function and compares each result with a value computed elsewhere (here by Excel). A new test is a new line in the file.

open-data-api:
  label: Open data API
  title: A public API chosen for its licence
  summary: One GET per unit of work with Invoke web service, retried when the network stumbles, its failure returned as a flag. The source is open data that allows commercial use and asks for no key, and an empty answer is treated as an error instead of a result.

desktop-flow-template:
  label: Flow template
  title: A desktop flow template to start every process from
  summary: The flow is saved with Save as and the type Template, then published; New › Flow from template gives each process its own copy, subflows, variables and notes included. Comments marked TEMPLATE say what a process replaces.

coloured-regions:
  label: Coloured regions
  title: Numbered regions, one colour per role
  summary: Each subflow is cut into numbered regions coloured by role (cyan state and settings, red guards, green reading, purple processing, blue sub-steps, gold output). Collapsed, the canvas reads in a few lines, and a region number names the place to change.

action-notes:
  label: Action notes
  title: A note on every action
  summary: The note of each action (Add note, at the top of its dialog) says why the action is there - the technical reason, the business rule or what a learner should keep. The notes travel with the pasted code and with the template.

transaction-outcomes:
  label: Business and system exceptions
  title: One outcome per work item, retries only for system exceptions
  summary: Each item ends SUCCESS, BUSINESS_EXCEPTION (the data breaks a rule, never retried) or SYSTEM_EXCEPTION (an action failed - screenshot, applications closed, pause, retry). A circuit breaker stops the run after a number of system exceptions in a row.

settings-per-environment:
  label: Settings per environment
  title: Settings in a CSV file, overridden per environment
  summary: The defaults live in the flow, a CSV file editable in Excel overrides them for every environment, and its rows for the current environment (DEV, TEST, PROD) win. Numbers are checked before use and a missing file is created with the defaults.

test-subflow:
  label: Tests subflow
  title: A Tests subflow that calls every function
  summary: A global subflow calls each local function with fixed inputs, its recovery paths included, and writes one PASS or FAIL line per case to a report. Run it before every change.
